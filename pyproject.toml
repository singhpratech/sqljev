[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sqljev"
dynamic = ["version"]
description = "Ask your SQL rows questions in plain English: jev(), jev_prob(), jev_choice(), jev_score() for SQL Server, PostgreSQL, MySQL, Snowflake, Databricks, BigQuery, Redshift and DuckDB, answered by Laya (open weights, fine-tunable) or TypeSafe Jev."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["sql", "laya", "jev", "pg-jev", "text-classification", "snowflake", "databricks", "sql-server", "postgresql", "mysql", "bigquery", "redshift", "duckdb", "fine-tuning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: SQL",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []   # the core, the gateway and the Lambda handler are stdlib-only

[project.optional-dependencies]
laya = ["laya>=0.3.20"]
db = ["sqlalchemy>=2.0"]
duckdb = ["duckdb>=1.1", "pyarrow>=14"]
spark = ["pyspark>=3.4", "pandas>=1.5", "pyarrow>=14"]
all = ["sqljev[laya,db,duckdb]"]
dev = ["pytest>=8", "sqlalchemy>=2.0", "duckdb>=1.1", "pyarrow>=14", "pandas>=1.5"]

[project.scripts]
sqljev = "sqljev.cli:main"

[project.urls]
Homepage = "https://singhpratech.github.io/sqljev/"
Source = "https://github.com/singhpratech/sqljev"
Issues = "https://github.com/singhpratech/sqljev/issues"
Changelog = "https://github.com/singhpratech/sqljev/blob/main/CHANGELOG.md"
"Fine-tune in Colab" = "https://colab.research.google.com/github/singhpratech/sqljev/blob/main/notebooks/sqljev_finetune_colab.ipynb"

[tool.hatch.version]
path = "src/sqljev/core.py"

[tool.hatch.build.targets.sdist]
exclude = ["/private", "/bench/*.duckdb", "/bench/results", "/site/banner.html", "/.github"]

[tool.hatch.build.targets.wheel]
packages = ["src/sqljev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
