[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sqljev"
dynamic = ["version"]
description = "Ask your SQL rows questions in plain language: jev(), jev_prob(), jev_choice(), jev_score() for SQL Server, Snowflake, Databricks, BigQuery, Redshift, DuckDB and any SQLAlchemy database, answered by Laya (open weights) or TypeSafe Jev."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["sql", "laya", "jev", "llm", "snowflake", "databricks", "sql-server", "bigquery", "redshift", "duckdb"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []   # the core, the gateway and the Lambda handler are stdlib-only

[project.optional-dependencies]
laya = ["laya>=0.3.20"]
db = ["sqlalchemy>=2.0"]
duckdb = ["duckdb>=1.1", "pyarrow>=14"]
spark = ["pyspark>=3.4", "pandas>=1.5", "pyarrow>=14"]
all = ["sqljev[laya,db,duckdb]"]
dev = ["pytest>=8", "sqlalchemy>=2.0", "duckdb>=1.1", "pyarrow>=14", "pandas>=1.5"]

[project.scripts]
sqljev = "sqljev.cli:main"

[project.urls]
Homepage = "https://github.com/singhpratech/sqljev"

[tool.hatch.version]
path = "src/sqljev/core.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sqljev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
