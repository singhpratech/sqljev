<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-labelledby="t">
  <title id="t">Rowl, the sqljev owl</title>
  <!-- ear tufts -->
  <path d="M52 58 L38 18 L78 46 Z" fill="#5E3E22"/>
  <path d="M148 58 L162 18 L122 46 Z" fill="#5E3E22"/>
