  <ellipse cx="100" cy="122" rx="74" ry="86" fill="#7A5230"/>
  <!-- wings -->
  <path d="M28 118 C18 150 30 186 58 196 C50 170 48 140 52 118 Z" fill="#5E3E22"/>
  <path d="M172 118 C182 150 170 186 142 196 C150 170 152 140 148 118 Z" fill="#5E3E22"/>
  <!-- belly: a little result grid -->
  <ellipse cx="100" cy="150" rx="46" ry="50" fill="#F6E7C8"/>
  <g stroke="#D9C39A" stroke-width="2.5" stroke-linecap="round">
    <line x1="68" y1="128" x2="132" y2="128"/>
    <line x1="62" y1="146" x2="138" y2="146"/>
    <line x1="62" y1="164" x2="138" y2="164"/>
    <line x1="70" y1="182" x2="130" y2="182"/>
    <line x1="92" y1="112" x2="92" y2="196"/>
  </g>
  <rect x="96" y="133" width="30" height="8" rx="4" fill="#2F8F5B"/>
  <rect x="96" y="151" width="10" height="8" rx="4" fill="#7D3C6B"/>
  <rect x="96" y="169" width="24" height="8" rx="4" fill="#2F8F5B"/>
  <!-- face disc -->
  <ellipse cx="72" cy="82" rx="30" ry="29" fill="#F6E7C8"/>
  <ellipse cx="128" cy="82" rx="30" ry="29" fill="#F6E7C8"/>
  <!-- eyes -->
  <circle cx="72" cy="82" r="21" fill="#F0A202"/>
  <circle cx="128" cy="82" r="21" fill="#F0A202"/>
  <circle cx="74" cy="84" r="10" fill="#152238"/>
  <circle cx="130" cy="84" r="10" fill="#152238"/>
  <circle cx="77" cy="80" r="3.5" fill="#fff"/>
  <circle cx="133" cy="80" r="3.5" fill="#fff"/>
  <!-- beak -->
  <path d="M92 100 L108 100 L100 116 Z" fill="#E08A00"/>
  <!-- feet -->
  <g fill="#E08A00">
    <rect x="70" y="200" width="7" height="14" rx="3.5"/><rect x="80" y="200" width="7" height="14" rx="3.5"/>
    <rect x="113" y="200" width="7" height="14" rx="3.5"/><rect x="123" y="200" width="7" height="14" rx="3.5"/>
