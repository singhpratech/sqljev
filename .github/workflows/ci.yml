name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python scripts/build_sql.py --check
      - run: pytest -q
      - name: private/ is never committed
        run: test -z "$(git ls-files private)"
  sqlserver:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env: {ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "SqlJev!Ci2026"}
        ports: ["1433:1433"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]" pymssql
      - run: python tests/sqlserver_smoke.py
        env: {SQLJEV_TEST_MSSQL: "mssql+pymssql://sa:SqlJev!Ci2026@127.0.0.1:1433/master"}
